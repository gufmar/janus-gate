[project]
name = "janus-gate"
version = "0.1.0"
description = "Bidirectional Cardano API compatibility gateway (Blockfrost <-> Koios)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "sshtunnel>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
janus-gate = "janus_gate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
