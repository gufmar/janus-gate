# Example: Blockfrost public face backed by local cardano-db-sync
server:
  host: 0.0.0.0
  port: 8080

public_face: blockfrost

backend:
  provider: dbsync
  # PostgreSQL as reachable from Janus, or from the SSH jump host when tunneling.
  dsn: postgresql://dbsync_user:CHANGE_ME@10.0.0.5:5432/cexplorer
  # Or set JANUS_BACKEND_DSN
  #
  # Optional: SSH local forward when Postgres is only reachable via a jump host.
  # ssh_tunnel:
  #   enabled: true
  #   host: bastion.example.com
  #   port: 22
  #   user: deploy
  #   private_key_path: /path/to/id_ed25519
  #   # private_key: |   # or PEM via JANUS_SSH_PRIVATE_KEY
  #   # passphrase: null
  #   # password: null
  #   # remote_bind_host: 10.0.0.5
  #   # remote_bind_port: 5432
  #   # local_bind_host: 127.0.0.1
  #   # local_bind_port: 0

auth:
  key_map: []
  fallback_backend_key: null
  # debug_log_keys: false

# Optional IP allowlist (see config.example.yaml)
# access:
#   allowed_ips: []
#   deny: endpoints

audit:
  enabled: true
  session_ttl_minutes: 60
  trusted_proxy_hops: 1
  max_events_per_session: 5000
