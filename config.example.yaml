# Janus Gate server (plain HTTP; terminate TLS at nginx)
server:
  host: 0.0.0.0
  port: 8080
  # Public URL prefix when the reverse proxy mounts Janus under a subpath and
  # strips that prefix before proxying (browser: /janus/..., upstream: /...).
  # Leave empty for root mount. Example: /janus
  # base_path: /janus

# Public API face clients talk to: blockfrost | koios
public_face: blockfrost

backend:
  # Data source: blockfrost | koios | dbsync (Phase 2) | ogmios | yaci (later)
  # Usual mode: API mirror different from public_face (translate).
  # Same face+API source only when passthrough: true (explicit proxy for testing).
  provider: koios
  base_url: https://api.koios.rest/api/v1
  # passthrough: false
  # For dbsync: omit base_url (or leave unused), set dsn instead.
  # dsn: postgresql://user:pass@10.0.0.5:5432/cexplorer
  # Optional SSH tunnel: see config.dbsync.example.yaml and docs/backends/dbsync.md
  # ssh_tunnel:
  #   host: bastion.example.com
  #   user: deploy
  #   private_key_path: /path/to/id_ed25519

# Map public-face API keys to backend API keys.
# Blockfrost face: clients send header `project_id: <public_key>`
# Koios face: clients send `Authorization: Bearer <public_key>`
auth:
  # - label: tenant-a
  #   public_key: mainnetYourBlockfrostProjectId
  #   backend_key: your_koios_bearer_token
  key_map: []
  # Used when project_id/Bearer is missing or not listed above.
  # Empty/omitted/null = call Koios without a key (free-tier limits).
  fallback_backend_key: null
  # When true, responses include X-Janus-Auth / X-Janus-Auth-Warning.
  # expose_janus_headers: false
  # When true, log masked public/backend keys for each face request to stdout.
  # debug_log_keys: false

# Optional client IP allowlist. Empty / omitted = no IP filter.
# access:
#   allowed_ips:
#     - 203.0.113.10
#     - 10.0.0.0/8
#   # endpoints: block face APIs (+ audit); keep /, /endpoints, OpenAPI, /health
#   # strict: restrict the entire service to allowed_ips
#   deny: endpoints
#   # Optional override; defaults to audit.trusted_proxy_hops
#   # trusted_proxy_hops: 1

# Compatibility audit: /audit/start and /audit/report (Janus-native).
# Bind sessions by client IP (sessionID=myIP) or public API key.
audit:
  enabled: true
  session_ttl_minutes: 60
  # Trust X-Forwarded-For / X-Real-IP from nginx (set 0 to ignore those headers).
  trusted_proxy_hops: 1
  max_events_per_session: 5000
