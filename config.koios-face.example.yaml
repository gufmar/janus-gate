# Example: Koios public face backed by Blockfrost
server:
  host: 0.0.0.0
  port: 8080

public_face: koios

backend:
  provider: blockfrost
  base_url: https://cardano-mainnet.blockfrost.io/api/v0

auth:
  key_map: []
    # - label: tenant-a
    #   public_key: your_public_koios_style_token
    #   backend_key: mainnetYourBlockfrostProjectId
  # Fallback Blockfrost project_id when Bearer is missing/unknown (or null for none).
  fallback_backend_key: null
  # expose_janus_headers: false

audit:
  enabled: true
  session_ttl_minutes: 60
  trusted_proxy_hops: 1
  max_events_per_session: 5000
